# Copiar a config.toml (que NO va a git) y completar.

[google]
# Remoto de rclone autorizado con la cuenta de la cátedra, scope drive.readonly:
#   rclone config create catedra drive scope=drive.readonly
rclone_remoto = "catedra"
hoja_inscripcion = "Inscripción (respuestas)"
hoja_entregas = "Entregas (respuestas)"
carpeta_archivos = "Entregas (File responses)"

[correo]
# Solo se suben BORRADORES por IMAP. El sistema nunca envía mails.
# La contraseña de aplicación va en .env como TUTOR_IMAP_PASS
cuenta = "catedra@ejemplo.edu"
imap_host = "imap.gmail.com"
firma_remitente = "Cátedra"

[audio]
# Python con faster-whisper instalado (vacío = el del proyecto)
audio_python = ""
whisper_modelo = "medium"

[ia]
claude_bin = "claude"
modelo = "haiku"
lote_max = 6

[seguridad]
# Solo se inscriben cuentas de estos dominios (el del colegio). Se pueden poner varios.
dominios_permitidos = ["colegio.edu.ar"]
# Opcional: CSV con los mails oficiales de los alumnos; si está, además tienen que figurar ahí.
nomina = ""
# Anti-inundación
max_entregas_por_actividad = 3
max_entregas_por_alumno_dia = 10
max_entregas_por_corrida = 60
tope_usd_corrida = 1.00
max_caracteres_respuesta = 6000
rafaga_por_minuto = 5
# Adjuntos
max_archivos = 5
max_mb = 15
max_minutos_audio = 10
