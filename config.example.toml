# Copiar a config.toml (que NO va a git) y completar.

[correo]
# Todo pasa por esta casilla. El sistema la LEE en solo lectura (no marca, no mueve, no borra)
# y deja BORRADORES por IMAP. Nunca envía mails.
# La contraseña de aplicación va en .env como TUTOR_IMAP_PASS (la carga ./tutor.sh configurar).
cuenta = "catedra@ejemplo.edu"
imap_host = "imap.gmail.com"
carpeta = "INBOX"
# No se leen mails anteriores a esta fecha (AAAA-MM-DD)
desde = ""
firma_remitente = "Cátedra"
zona_horaria = "America/Argentina/Buenos_Aires"

[calificacion]
# Nivel de rúbrica -> nota. La nota es el promedio de los criterios, redondeado.
nota_inicial = 4
nota_en_desarrollo = 6
nota_logrado = 8
nota_destacado = 10
# Con esta nota o más la actividad queda aprobada; si no, el alumno itera.
nota_aprobacion = 7

[audio]
# Python con faster-whisper instalado (vacío = el del proyecto)
audio_python = ""
whisper_modelo = "medium"

[ia]
claude_bin = "claude"
# Router: lo normal va al modelo rápido; imágenes, sospechas y reintentos al fuerte.
# Fijados por versión para que los resultados sean comparables entre corridas.
modelo_rapido = "claude-haiku-5-5"
modelo_fuerte = "claude-sonnet-5-5"
lote_max = 6

[seguridad]
# Solo se inscriben cuentas de estos dominios (el del colegio). Se pueden poner varios.
dominios_permitidos = ["colegio.edu.ar"]
# Opcional: CSV con los mails oficiales de los alumnos; si está, además tienen que figurar ahí.
nomina = ""
# Anti-inundación
# Versiones de una misma actividad por alumno; pasado el tope, queda para que la mires vos
max_iteraciones = 6
max_entregas_por_alumno_dia = 10
max_entregas_por_corrida = 60
tope_usd_corrida = 1.00
max_caracteres_respuesta = 6000
rafaga_por_minuto = 5
# Adjuntos
max_archivos = 5
max_mb = 15
max_minutos_audio = 10
